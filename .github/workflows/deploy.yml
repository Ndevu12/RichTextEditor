name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DEPLOY_PAGES: 'true'

jobs:
  library:
    name: Build library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install root dependencies
        run: yarn install --immutable

      - name: Build library
        run: yarn build

      - name: Upload library dist
        uses: actions/upload-artifact@v4
        with:
          name: library-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  playground:
    name: Build playground
    needs: library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The playground aliases the package to ../dist, so it builds the library just produced.
      - name: Download library dist
        uses: actions/download-artifact@v4
        with:
          name: library-dist
          path: dist

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            playground/yarn.lock

      # dist/index.js imports react and the other packages tsup left external.
      # Those resolve from the root install, not from playground/node_modules.
      - name: Install root dependencies
        run: yarn install --immutable

      - name: Install playground dependencies
        working-directory: playground
        run: yarn install

      - name: Build playground
        working-directory: playground
        run: yarn build

      - name: Upload playground dist
        uses: actions/upload-artifact@v4
        with:
          name: playground-dist
          path: playground/dist
          if-no-files-found: error
          retention-days: 1

  react-demo:
    name: Build react-demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: examples/react-demo/yarn.lock

      - name: Install react-demo dependencies
        working-directory: examples/react-demo
        run: yarn install

      - name: Build react-demo
        working-directory: examples/react-demo
        run: npx vite build

      - name: Upload react-demo dist
        uses: actions/upload-artifact@v4
        with:
          name: react-demo-dist
          path: examples/react-demo/dist
          if-no-files-found: error
          retention-days: 1

  nextjs-demo:
    name: Build nextjs-demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: examples/nextjs-demo/yarn.lock

      - name: Install nextjs-demo dependencies
        working-directory: examples/nextjs-demo
        run: yarn install

      - name: Build nextjs-demo
        working-directory: examples/nextjs-demo
        run: npx next build

      - name: Upload nextjs-demo output
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-demo-out
          path: examples/nextjs-demo/out
          if-no-files-found: error
          retention-days: 1

  storybook:
    name: Build storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install root dependencies
        run: yarn install --immutable

      - name: Build storybook
        run: yarn build-storybook

      - name: Upload storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble site
    needs: [playground, react-demo, nextjs-demo, storybook]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download playground dist
        uses: actions/download-artifact@v4
        with:
          name: playground-dist
          path: playground/dist

      - name: Download react-demo dist
        uses: actions/download-artifact@v4
        with:
          name: react-demo-dist
          path: examples/react-demo/dist

      - name: Download nextjs-demo output
        uses: actions/download-artifact@v4
        with:
          name: nextjs-demo-out
          path: examples/nextjs-demo/out

      - name: Download storybook
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

      - name: Assemble deployment directory
        run: |
          mkdir -p _site/assets
          cp src/assets/GEOFINDA-bgless-logo.png _site/assets/geofinda-logo.png
          cp src/assets/rich-text-editor-hub-og.png _site/assets/rich-text-editor-hub-og.png
          cp -r playground/dist/        _site/playground
          cp -r examples/react-demo/dist/ _site/react-demo
          cp -r examples/nextjs-demo/out/ _site/nextjs-demo
          cp -r storybook-static/        _site/storybook
          cp .github/pages/index.html    _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
