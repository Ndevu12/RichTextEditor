name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          GIT_TAG="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$GIT_TAG" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match git tag ($GIT_TAG). Nothing was published."
            exit 1
          fi

      - name: Check npm publish status
        id: publish_status
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PKG_NAME}@${PKG_VERSION} is already published. Skipping publish steps."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${PKG_NAME}@${PKG_VERSION} is not yet published. Continuing."
          fi

      - name: Run tests
        if: steps.publish_status.outputs.already_published != 'true'
        run: yarn test

      - name: Build library
        if: steps.publish_status.outputs.already_published != 'true'
        run: yarn build

      - name: Verify dist output
        if: steps.publish_status.outputs.already_published != 'true'
        run: |
          test -f dist/index.js || (echo "Missing dist/index.js" && exit 1)
          test -f dist/index.cjs || (echo "Missing dist/index.cjs" && exit 1)
          test -f dist/index.d.ts || (echo "Missing dist/index.d.ts" && exit 1)
          test -f dist/index.css || (echo "Missing dist/index.css" && exit 1)

      - name: Publish to npm with provenance
        if: steps.publish_status.outputs.already_published != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
